<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HDanh</title>
  <meta name="description" content="Trang chia sẻ của HDanh">

  <!-- Zalo/Facebook và các nền tảng đọc Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="HDanh">
  <meta property="og:description" content="Trang chia sẻ của HDanh">
  <meta property="og:image" content="thumb.jpg">
  <meta property="og:image:alt" content="HDanh">
  <meta property="og:url" content="https://example.com/">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    .card {
      width: min(92%, 700px);
      text-align: center;
      padding: 24px;
    }
    img {
      width: 100%;
      max-height: 70vh;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }
    h1 { margin: 20px 0 8px; }
    p { color: #bbb; margin: 0; }
  </style>
</head>

<body>
  <main class="card">
    <img src="thumb.jpg" alt="HDanh">
    <h1>HDanh</h1>
    <p>Trang chia sẻ của HDanh</p>
  </main>
</body>
</html>
